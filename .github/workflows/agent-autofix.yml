name: Agent Autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  autofix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deep-research-foundations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - name: Apply repository fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          objects = Path('apps/cli/src/store/objects.rs')
          source = objects.read_text()
          helper_start = source.find('\nfn looks_like_json(data: &[u8]) -> bool {')
          if helper_start != -1:
              helper_end = source.index('\n\n/// Object store for the local', helper_start)
              source = source[:helper_start] + source[helper_end:]

          old_loader = '''    /// Load a manifest by hash.\n    ///\n    /// Current writers emit JSON. Binary bincode payloads from older\n    /// experiments remain readable for backwards compatibility.\n    pub fn load_manifest(&self, hash: &Hash) -> Result<Manifest, ObjectError> {\n        let path = self.object_path(ObjectType::Manifest, hash);\n\n        if !path.exists() {\n            return Err(ObjectError::NotFound(hash.to_hex()));\n        }\n\n        let data = fs::read(&path)?;\n        let computed = Hasher::hash(&data);\n        if computed != *hash {\n            return Err(ObjectError::ChecksumMismatch {\n                expected: hash.to_hex(),\n                actual:   computed.to_hex(),\n            });\n        }\n\n        let json_error = if looks_like_json(&data) {\n            match std::str::from_utf8(&data)\n                .map_err(|error| error.to_string())\n                .and_then(|json| Manifest::from_json(json).map_err(|error| error.to_string()))\n            {\n                Ok(manifest) => return Ok(manifest),\n                Err(error) => Some(error),\n            }\n        } else {\n            None\n        };\n\n        bincode::deserialize::<Manifest>(&data).map_err(|binary_error| {\n            let json_context = json_error\n                .map(|error| format!("; JSON parse error: {error}"))\n                .unwrap_or_default();\n            ObjectError::SerializationError(format!(\n                "Manifest is neither current JSON nor a supported legacy binary payload: \\\n                 {binary_error}{json_context}"\n            ))\n        })\n    }\n'''
          new_loader = '''    /// Load a manifest by hash.\n    ///\n    /// The current repository format stores manifests as UTF-8 JSON. Historical\n    /// comments mentioned bincode, but the canonical writer did not publish a\n    /// stable binary manifest format. Reject unknown encodings rather than\n    /// guessing, so incompatible repository data cannot be silently\n    /// misinterpreted.\n    pub fn load_manifest(&self, hash: &Hash) -> Result<Manifest, ObjectError> {\n        let path = self.object_path(ObjectType::Manifest, hash);\n\n        if !path.exists() {\n            return Err(ObjectError::NotFound(hash.to_hex()));\n        }\n\n        let data = fs::read(&path)?;\n        let computed = Hasher::hash(&data);\n        if computed != *hash {\n            return Err(ObjectError::ChecksumMismatch {\n                expected: hash.to_hex(),\n                actual:   computed.to_hex(),\n            });\n        }\n\n        let json = std::str::from_utf8(&data).map_err(|error| {\n            ObjectError::SerializationError(format!(\n                "Manifest is not valid UTF-8 JSON: {error}"\n            ))\n        })?;\n        Ok(Manifest::from_json(json)?)\n    }\n'''
          if old_loader in source:
              source = source.replace(old_loader, new_loader)
          elif new_loader not in source:
              raise SystemExit('manifest loader did not match the reviewed source')

          old_test = '''    #[test]\n    fn test_load_legacy_binary_manifest() {\n        let temp = tempdir().unwrap();\n        let store = ObjectStore::new(temp.path());\n        store.init().unwrap();\n\n        let mut manifest = Manifest::new();\n        manifest.add(crate::core::ManifestEntry::new(\n            "legacy.bin".to_string(),\n            42,\n            Hash::ZERO,\n            vec![],\n        ));\n\n        let data = bincode::serialize(&manifest).unwrap();\n        let hash = Hasher::hash(&data);\n        let path = store.object_path(ObjectType::Manifest, &hash);\n        assert!(write_atomic_if_missing(&path, &data).unwrap());\n\n        let loaded = store.load_manifest(&hash).unwrap();\n        assert_eq!(loaded.len(), 1);\n    }\n\n'''
          new_test = '''    #[test]\n    fn test_rejects_unknown_manifest_encoding() {\n        let temp = tempdir().unwrap();\n        let store = ObjectStore::new(temp.path());\n        store.init().unwrap();\n\n        let data = b"\\x00\\x01not-json";\n        let hash = Hasher::hash(data);\n        let path = store.object_path(ObjectType::Manifest, &hash);\n        assert!(write_atomic_if_missing(&path, data).unwrap());\n\n        let result = store.load_manifest(&hash);\n        assert!(matches!(result, Err(ObjectError::SerializationError(_))));\n    }\n\n'''
          if old_test in source:
              source = source.replace(old_test, new_test)
          elif new_test not in source:
              raise SystemExit('legacy manifest test did not match the reviewed source')
          objects.write_text(source)

          parser = Path('apps/cli/src/dependency/parser.rs')
          source = parser.read_text()
          source = source.replace(
              'use quick_xml::{events::Event, Reader};',
              'use quick_xml::{escape::unescape, events::Event, Reader};',
          )
          source = source.replace(
              'let path_str = e.unescape().map_err(|e| ParseError::Xml(e.to_string()))?;',
              '''let decoded = e.decode().map_err(|e| ParseError::Xml(e.to_string()))?;\n                    let path_str =\n                        unescape(decoded.as_ref()).map_err(|e| ParseError::Xml(e.to_string()))?;''',
          )
          source = source.replace(
              'if let Ok(value) = attr.unescape_value() {',
              'if let Ok(value) = attr.decode_and_unescape_value(reader.decoder()) {',
          )
          source = source.replace(
              'let text = e.unescape().map_err(|e| ParseError::Xml(e.to_string()))?;',
              '''let decoded = e.decode().map_err(|e| ParseError::Xml(e.to_string()))?;\n                    let text =\n                        unescape(decoded.as_ref()).map_err(|e| ParseError::Xml(e.to_string()))?;''',
          )
          if '.unescape()' in source:
              raise SystemExit('unmigrated quick-xml BytesText::unescape call')
          parser.write_text(source)

          cargo = Path('apps/cli/Cargo.toml')
          source = cargo.read_text()
          source = source.replace('git2 = { version = "0.19", features = ["vendored-libgit2"] }',
                                  'git2 = { version = "0.21", features = ["vendored-libgit2"] }')
          source = source.replace('git2 = { version = "0.19", features = ["vendored-openssl"] }',
                                  'git2 = { version = "0.21", features = ["vendored-openssl"] }')
          source = source.replace('quick-xml = "0.37"', 'quick-xml = "0.41"')
          source = source.replace('\nlru = "0.12"', '')
          cargo.write_text(source)

          audit = Path('.cargo/audit.toml')
          source = audit.read_text()
          source = source.replace('''\n    # git2 0.19 "Buf" deref soundness advisory. The fix lands in a newer\n    # major (0.20+) that pulls a different libgit2-sys; bumping is tracked\n    # separately to avoid destabilizing the Git hybrid-storage path. Not\n    # reachable from untrusted input in our usage.\n    "RUSTSEC-2026-0008",\n\n    # lru 0.12 IterMut Stacked-Borrows soundness advisory. The patched line\n    # (0.14+) changes API; bump tracked separately. We do not use IterMut.\n    "RUSTSEC-2026-0002",\n''', '\n')
          source = source.replace(
              'release available in our current dependency tree. They are tracked here with a',
              'release available without replacing an active subsystem. They are tracked here with a',
          )
          audit.write_text(source)

          ci = Path('.github/workflows/ci.yml')
          source = ci.read_text()
          source = source.replace('''          --ignore RUSTSEC-2025-0119\n          --ignore RUSTSEC-2026-0008\n          --ignore RUSTSEC-2026-0002''',
                                  '''          --ignore RUSTSEC-2025-0119''')
          services_start = source.find('    services:\n', source.index('  test-rust:'))
          if services_start != -1:
              services_end = source.index('    steps:\n', services_start)
              source = source[:services_start] + source[services_end:]
          ci.write_text(source)

          concepts = Path('docs/concepts.md')
          source = concepts.read_text()
          source = source.replace(
              '''Current writers serialize manifests as JSON. Older binary bincode manifests\nremain a compatibility concern, but bincode is not a suitable public,\ncross-language protocol contract.''',
              '''Current writers and readers serialize manifests as UTF-8 JSON. Earlier comments\nmentioned bincode, but the canonical writer did not establish a stable binary\nmanifest format. Unknown encodings are rejected rather than guessed. A future\npublic binary format requires an explicit version marker and conformance vectors.''',
          )
          concepts.write_text(source)

          foundations = Path('docs/research/technical-foundations.md')
          source = foundations.read_text()
          source = source.replace(
              '| P1 | Current JSON writers were paired with bincode-first readers in the manifest and index paths. | Every normal uncached read pays a failed parse; one path also clones the buffer. | Detect the current format first; retain explicit legacy readers behind a version marker. |',
              '| P1 | Current JSON writers were paired with bincode-first readers even though no stable binary manifest writer existed. | Every normal uncached read paid a failed parse and the apparent compatibility path could not reliably decode current structures. | Read the canonical JSON format directly; reject unknown encodings until a versioned migration reader and conformance fixtures exist. |',
          )
          foundations.write_text(source)
          PY

      - name: Refresh lockfile and format
        run: |
          cargo +stable update -p quick-xml -p git2
          cargo +nightly fmt --all
          git diff --check

      - name: Capture validation
        run: |
          mkdir -p .agent-autofix
          set +e
          cargo +stable check --workspace --all-targets > .agent-autofix/check.txt 2>&1
          echo "$?" > .agent-autofix/check.exit
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings > .agent-autofix/clippy.txt 2>&1
          echo "$?" > .agent-autofix/clippy.exit
          cargo +stable test --workspace --all-targets --no-fail-fast > .agent-autofix/test.txt 2>&1
          echo "$?" > .agent-autofix/test.exit
          bash scripts/check-cli-docs.sh > .agent-autofix/docs.txt 2>&1
          echo "$?" > .agent-autofix/docs.exit
          {
            echo "check=$(cat .agent-autofix/check.exit)"
            echo "clippy=$(cat .agent-autofix/clippy.exit)"
            echo "test=$(cat .agent-autofix/test.exit)"
            echo "docs=$(cat .agent-autofix/docs.exit)"
          } > .agent-autofix/status.txt
          exit 0

      - name: Commit fixes and validation report
        run: |
          git config user.name "OpenAI"
          git config user.email "agent@openai.com"
          git add .agent-autofix .cargo/audit.toml .github/workflows/ci.yml \
            apps/cli/Cargo.toml Cargo.lock apps/cli/src/config/mod.rs \
            apps/cli/src/dependency/parser.rs apps/cli/src/store/objects.rs \
            apps/cli/src/telemetry.rs docs/concepts.md \
            docs/research/technical-foundations.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: resolve CI blockers and refresh dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
