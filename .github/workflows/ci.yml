name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Security and dependency checks
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # Temporary bootstrap for repositories created before the application
      # lockfile was committed. The artifact lets maintainers review and add the
      # exact graph; once Cargo.lock exists, this command is a no-op update.
      - name: Resolve application dependency graph
        run: cargo generate-lockfile

      - name: Upload resolved Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error

      # `--deny warnings` would also fail on informational advisories
      # (unmaintained / unsound) that have no patched release in our current
      # dependency tree. Each is tracked with a rationale in .cargo/audit.toml
      # and listed explicitly below so the gate is deterministic regardless of
      # cargo-audit's config discovery. Real, fixable vulnerabilities still fail.
      - name: Run security audit
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2025-0119

      - name: Check for vulnerable dependencies
        run: cargo audit --format json | jq -e '.vulnerabilities.found == false'

  # Rust linting and formatting
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # rustfmt.toml uses nightly-only options, so formatting is authored with
      # nightly rustfmt. Stable `cargo fmt --check` can't apply those options and
      # would always report a diff — run the format check on nightly instead.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # fuser feature requires libfuse3-dev for --all-features compilation
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items

      - name: Check CLI docs match the binary
        run: bash scripts/check-cli-docs.sh

      - name: Check public product claims
        run: bash scripts/check-product-truth.sh

      - name: Check maintained Markdown links
        run: node scripts/check-markdown-links.mjs

  # Rust unit tests
  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest

      - name: Run tests with coverage
        run: cargo nextest run --profile ci

      - name: Generate coverage report
        continue-on-error: true
        run: |
          cargo install --locked cargo-tarpaulin
          mkdir -p coverage
          cargo tarpaulin --out Xml --output-dir coverage

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: coverage/cobertura.xml
          flags: rust
          name: Rust Coverage

  # Integration tests (shell scripts)
  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI
        working-directory: apps/cli
        run: cargo build --release

      - name: Run integration tests
        working-directory: apps/cli
        env:
          DITS_BUILD_DIR: ${{ github.workspace }}/target/release
        run: ./t/run-tests.sh

      # The historical runner only discovers top-level tNNNN wrappers. Keep
      # this real remote fail-closed regression explicit until the QA tree is
      # migrated into the canonical integration suite.
      - name: Run fail-closed remote regression
        working-directory: apps/cli/t
        env:
          DITS_BUILD_DIR: ${{ github.workspace }}/target/release
        run: ./qa/t1400-network-failures.sh

  # Build CLI binaries
  build-cli:
    name: Build CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI
        working-directory: apps/cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dits${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error

  # Web app linting
  lint-web:
    name: Lint Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --workspace apps/web

      - name: Run TypeScript check
        run: npm run build --workspace apps/web

  # Web app tests
  test-web:
    name: Test Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci --workspace apps/web

  # Performance benchmarks — regression guard for the real benchmark suite.
  # (The old cargo-criterion job was stale: criterion benches were quarantined
  # to legacy/ on 2026-06-02. This runs the canonical engine benches + the
  # comparative harness unit tests + a CI-profile smoke that asserts the dits
  # dedup wins still hold. External CDC tools (restic/borg/xdelta3) aren't
  # installed here, so the harness skips them gracefully — the dits-only
  # FACR asserts still run.)
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install FFmpeg + git-lfs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg git-lfs

      - name: Build dits (release)
        run: cargo build --release -p dits

      - name: Comparative harness unit tests
        run: npm run bench:comparative:test

      - name: npm launcher resolver tests
        run: npm test --workspace packages/npm

      - name: Engine micro-benchmarks (FastCDC / BLAKE3 / SHA-256)
        run: cargo test -p dits --release --test benchmarks -- --ignored --nocapture --test-threads=1

      - name: Generate test media
        run: benchmarks/comparative/media/gen-media.sh small

      - name: Comparative regression smoke (asserts dits dedup wins)
        run: npm run bench:comparative

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/comparative/latest.json

  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # actions-rs/audit was removed from GitHub; run cargo-audit directly.
      # Mirror the exact ignore list from the Security Audit job.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # Keep the bootstrap CI run auditable before the generated application
      # lockfile is committed. Remove this alongside the Security Audit
      # bootstrap step once Cargo.lock is in the repository.
      - name: Resolve application dependency graph
        run: cargo generate-lockfile

      - name: Scan Rust dependencies
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2025-0119

      # This repo uses npm (root package-lock.json), not pnpm. `--audit-level
      # high` gates on genuinely actionable advisories without failing on the
      # low/moderate transitive noise common in large frontend trees.
      - name: Scan Node.js dependencies
        run: npm audit --audit-level high

  # CodeQL security analysis
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust, javascript-typescript
          config-file: .github/codeql/codeql-config.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI
        working-directory: apps/cli
        run: cargo build --release

      - name: Build web app
        run: npm run build --workspace apps/web

      # One analyze invocation finalizes and uploads every database initialized
      # above. Running it once per language would try to finalize the same
      # multi-language databases twice.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # Docker image build — guards the Dockerfile and the from-source build path so
  # a dependency or compiler change can't silently break `docker build` again
  # (regression guard for the "Binary not found" / build-break reports).
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dits:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run --rm dits:ci --version
          tmp="$(mktemp -d)"
          docker run --rm -v "$tmp:/data" dits:ci init
          test -d "$tmp/.dits"
          echo "Docker image smoke test passed"

  # Final status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [security, lint-rust, test-rust, test-integration, build-cli, docker-build, lint-web, test-web, benchmark, dependency-scan, codeql]
    if: always()
    steps:
      - name: Check all jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failures="$(jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"
          ' <<<"$NEEDS_JSON")"
          if [[ -n "$failures" ]]; then
            echo "The following required CI jobs did not succeed:"
            echo "$failures"
            exit 1
          fi
          echo "All CI checks passed!"
