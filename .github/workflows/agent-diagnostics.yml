name: Agent Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Export repository snapshot
        run: |
          mkdir -p snapshot
          git rev-parse 'HEAD^{tree}' > snapshot/head.tree
          git rev-parse HEAD > snapshot/head.commit
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude=node_modules \
            --exclude=snapshot \
            -czf snapshot/repository.tar.gz .

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: agent-snapshot
          path: snapshot
          if-no-files-found: error

  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Format and refresh workspace metadata
        run: |
          mkdir -p diagnostics/formatted/apps/cli/src/config
          mkdir -p diagnostics/formatted/apps/cli/src/store
          cargo +nightly fmt --all
          cargo metadata --format-version 1 > diagnostics/metadata.json
          cp Cargo.lock diagnostics/Cargo.lock.generated
          cp apps/cli/src/config/mod.rs diagnostics/formatted/apps/cli/src/config/mod.rs
          cp apps/cli/src/store/objects.rs diagnostics/formatted/apps/cli/src/store/objects.rs
          cp apps/cli/src/telemetry.rs diagnostics/formatted/apps/cli/src/telemetry.rs
          git diff -- apps/cli/src/config/mod.rs apps/cli/src/store/objects.rs apps/cli/src/telemetry.rs > diagnostics/rustfmt.patch
          git rev-parse 'HEAD^{tree}' > diagnostics/head.tree
          git rev-parse HEAD > diagnostics/head.commit

      - name: Export audit result
        run: |
          cargo install --locked cargo-audit
          cargo audit --format json > diagnostics/audit.json || true

      - name: Export check, clippy, and test results
        run: |
          set +e
          cargo +stable check --workspace --all-targets > diagnostics/check.txt 2>&1
          echo "$?" > diagnostics/check.exit
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings > diagnostics/clippy.txt 2>&1
          echo "$?" > diagnostics/clippy.exit
          cargo +stable test --workspace --all-targets --no-fail-fast > diagnostics/test.txt 2>&1
          echo "$?" > diagnostics/test.exit
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: agent-diagnostics
          path: diagnostics
          if-no-files-found: error
