name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS  (macos-latest is arm64; darwin-x64 runs via Rosetta 2)
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x64
            smoke: true

          # Linux (glibc) — build via `cross` so the binary links an older,
          # widely-compatible glibc. Building natively on ubuntu-latest links
          # the runner's glibc (2.39), which fails on common distros (Debian 12,
          # Ubuntu 22.04, …) with "GLIBC_2.39 not found".
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            cross: true
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
            cross: true   # cross-built; runtime-tested locally via Docker/QEMU

          # Linux (musl)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-x64-musl
            smoke: true    # static musl binary runs on the glibc host
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-arm64-musl
            cross: true   # cross-built; runtime-tested locally via Docker/QEMU

          # Windows  (x64 runner; win32-arm64 is cross-built, no native runner)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
            smoke: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform: win32-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches the source version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="$INPUT_VERSION"
          else
            EXPECTED="${GITHUB_REF_NAME#v}"
          fi
          SOURCE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          CLI_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/cli/Cargo.toml | head -1)
          CORE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' packages/dits-core/Cargo.toml | head -1)
          NPM_VERSION=$(node -p "require('./packages/npm/package.json').version")
          NPM_LOCK_VERSION=$(node -p "require('./package-lock.json').packages['packages/npm'].version")
          if [ "$SOURCE_VERSION" != "$EXPECTED" ] ||
             [ "$CLI_VERSION" != "$EXPECTED" ] ||
             [ "$CORE_VERSION" != "$EXPECTED" ] ||
             [ "$NPM_VERSION" != "$EXPECTED" ] ||
             [ "$NPM_LOCK_VERSION" != "$EXPECTED" ]; then
            echo "Release version mismatch: tag/input=$EXPECTED workspace=$SOURCE_VERSION cli=$CLI_VERSION core=$CORE_VERSION npm=$NPM_VERSION package-lock=$NPM_LOCK_VERSION" >&2
            echo "Update source versions and review docs/STATUS.md before publishing." >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (cross)
        if: matrix.cross
        working-directory: apps/cli
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.cross"
        working-directory: apps/cli
        env:
          # Statically link the MSVC runtime on Windows so the published binary
          # runs on a clean machine without the VC++ Redistributable (otherwise
          # it depends on vcruntime140.dll and fails to start where that isn't
          # installed). No-op on macOS/Linux.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test (run the freshly built binary)
        if: matrix.smoke
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/dits"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="${BIN}.exe"; fi
          echo "Running: $BIN --version"
          "$BIN" --version
          echo "Running: $BIN --help"
          "$BIN" --help > /dev/null
          echo "✓ ${{ matrix.platform }} binary executes"

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/dits || true

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/${{ matrix.platform }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/dits.exe artifacts/${{ matrix.platform }}/
          else
            cp target/${{ matrix.target }}/release/dits artifacts/${{ matrix.platform }}/
            chmod +x artifacts/${{ matrix.platform }}/dits
          fi

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd artifacts/${{ matrix.platform }}
          tar -czvf ../dits-${{ matrix.platform }}.tar.gz dits
          cd ..
          archive="dits-${{ matrix.platform }}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd artifacts/${{ matrix.platform }}
          Compress-Archive -Path dits.exe -DestinationPath ../dits-${{ matrix.platform }}.zip
          cd ..
          (Get-FileHash dits-${{ matrix.platform }}.zip -Algorithm SHA256).Hash.ToLower() + "  dits-${{ matrix.platform }}.zip" | Out-File -Encoding ascii dits-${{ matrix.platform }}.zip.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}
          retention-days: 1

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.platform }}
          path: |
            artifacts/dits-${{ matrix.platform }}.*
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          set -euo pipefail
          SOURCE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$SOURCE_VERSION"
          printf 'version=%s\n' "$SOURCE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## Installation

            ### Manual Download
            Download the archive for your platform below, verify its adjacent SHA-256
            file, extract it, and add `dits` to PATH. Dits is alpha software: evaluate
            it on disposable or independently backed-up data.

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `dits-darwin-arm64.tar.gz` |
            | macOS (Intel) | `dits-darwin-x64.tar.gz` |
            | Linux (x64) | `dits-linux-x64.tar.gz` |
            | Linux (ARM64) | `dits-linux-arm64.tar.gz` |
            | Linux (x64 musl) | `dits-linux-x64-musl.tar.gz` |
            | Linux (ARM64 musl) | `dits-linux-arm64-musl.tar.gz` |
            | Windows (x64) | `dits-win32-x64.zip` |
            | Windows (ARM64) | `dits-win32-arm64.zip` |

            The release workflow also attempts to publish the same assembled binary
            matrix to `@byronwade/dits`. A GitHub release does not by itself prove that
            npm publication succeeded; check the npm package version before installing.

  publish-npm:
    name: Publish to npm
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: packages/npm/bin

      - name: Reorganize binaries
        run: |
          cd packages/npm/bin
          for dir in binary-*; do
            platform="${dir#binary-}"
            mkdir -p "$platform"
            mv "$dir"/* "$platform/" 2>/dev/null || true
            rmdir "$dir" 2>/dev/null || true
          done
          find . -name 'dits' -type f -exec chmod +x {} \;
          ls -la */

      - name: Update version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd packages/npm
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Verify packaged launcher
        run: |
          cd packages/npm
          node scripts/verify-binaries.js
          node bin/dits --version

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/npm
          npm publish --access public
