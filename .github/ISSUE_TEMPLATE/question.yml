name: Question
description: Ask about installation, local evaluation, or current project behavior.
title: "question: "
labels:
  - question
body:
  - type: input
    id: version
    attributes:
      label: Dits version or commit
      placeholder: "0.1.5 or commit SHA"
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to do and where you became blocked.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and commands
      description: Include OS, architecture, install method, exact commands, and redacted output when relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the implementation status, getting-started guide, and existing issues.
          required: true
        - label: I removed secrets, personal data, private media, and proprietary content.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
