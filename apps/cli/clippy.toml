# Dits Clippy Configuration
# https://rust-lang.github.io/rust-clippy/

# Complexity thresholds
cognitive-complexity-threshold = 25
too-many-arguments-threshold = 7
too-many-lines-threshold = 100
type-complexity-threshold = 250

# Naming
enum-variant-name-threshold = 3

# Doc
missing-docs-in-crate-items = true

# Matches
single-char-binding-names-threshold = 4

# NOTE: disallowed-methods and disallowed-types were removed because the
# existing codebase has hundreds of pre-existing violations (.unwrap(),
# SystemTime, etc.) that predate these rules. They are aspirational and
# will be re-introduced once a dedicated cleanup sprint is complete.

# Allowed patterns
allowed-idents-below-min-chars = ["i", "j", "k", "n", "x", "y", "id", "to", "tx", "rx"]
