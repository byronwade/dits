[workspace]
members = [
  "apps/cli",
  "packages/dits-core",
]
# The former apps/cli/crates/* backend workspace was quarantined to
# legacy/backend-crates on 2026-06-02. It is now a self-contained nested
# workspace so backend research cannot leak dependencies into the canonical
# local-first build.
exclude = [
  "legacy",
]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/byronwade/dits"
