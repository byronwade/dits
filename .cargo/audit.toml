# cargo-audit configuration.
#
# The advisories ignored below are all *informational* (unmaintained / unsound)
# rather than known-exploitable vulnerabilities, and none has a drop-in patched
# release available in our current dependency tree. They are tracked here with a
# rationale so `cargo audit --deny warnings` stays green while real, fixable
# vulnerabilities continue to fail the build. Revisit on dependency bumps.
[advisories]
ignore = [
    # bincode 1.x is unmaintained. It remains in the legacy-index/encrypted-
    # chunk readers and experimental in-process/QUIC demo framing. P2P product
    # commands and repository remotes fail closed. Every remaining decoder now
    # has an enclosing byte/allocation limit and matching writers enforce the
    # same cap. Migration to a maintained format remains tracked separately
    # because bincode 2.x rewrites the API and encoding.
    "RUSTSEC-2025-0141",

    # number_prefix is unmaintained. Pulled in transitively by `indicatif`
    # (progress bars). No direct usage, no patched release; will clear when
    # indicatif drops the dependency.
    "RUSTSEC-2025-0119",

]
